      </text>

      <!-- Table Row 2 -->
      <text x="44" y="254" font-size="11">
        <tspan fill="#C9D1D9">│  </tspan><tspan fill="#58A6FF">2</tspan><tspan fill="#C9D1D9">  │ NVIDIA H100 80GB HBM3     │ </tspan><tspan fill="#3FB950" font-weight="bold">288.0 W</tspan><tspan fill="#C9D1D9"> │  53 °C  │ </tspan><tspan fill="#58A6FF">1095 MHz</tspan><tspan fill="#C9D1D9"> │ 2619 MHz │ 41.0 / 80.0 GB │   </tspan><tspan fill="#79C0FF">76%</tspan><tspan fill="#C9D1D9">   │</tspan>
      </text>

      <!-- Table Row 3 -->
      <text x="44" y="272" font-size="11">
        <tspan fill="#C9D1D9">│  </tspan><tspan fill="#58A6FF">3</tspan><tspan fill="#C9D1D9">  │ NVIDIA H100 80GB HBM3     │ </tspan><tspan fill="#3FB950" font-weight="bold">284.0 W</tspan><tspan fill="#C9D1D9"> │  52 °C  │ </tspan><tspan fill="#58A6FF">1095 MHz</tspan><tspan fill="#C9D1D9"> │ 2619 MHz │ 40.9 / 80.0 GB │   </tspan><tspan fill="#79C0FF">73%</tspan><tspan fill="#C9D1D9">   │</tspan>
      </text>
      <text x="44" y="288" fill="#8B949E" font-size="11">└─────┴───────────────────────────┴─────────┴─────────┴──────────┴──────────┴────────────────┴─────────┘</text>

      <!-- Telemetry Readout Highlights Box -->
      <rect x="44" y="304" width="792" height="68" rx="6" fill="#161B22" stroke="#3FB950" stroke-width="1" stroke-dasharray="3 3"/>
      
