      <!-- Table Row 0 -->
      <text x="44" y="218" font-size="11">
        <tspan fill="#C9D1D9">│  </tspan><tspan fill="#58A6FF">0</tspan><tspan fill="#C9D1D9">  │ NVIDIA H100 80GB HBM3     │ </tspan><tspan fill="#3FB950" font-weight="bold">285.0 W</tspan><tspan fill="#C9D1D9"> │  52 °C  │ </tspan><tspan fill="#58A6FF">1095 MHz</tspan><tspan fill="#C9D1D9"> │ 2619 MHz │ 41.2 / 80.0 GB │   </tspan><tspan fill="#79C0FF">74%</tspan><tspan fill="#C9D1D9">   │</tspan>
      </text>

