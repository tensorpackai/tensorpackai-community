<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" height="auto" style="background: transparent; font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="12" in="SourceAlpha"/>
      <feOffset dx="0" dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
  </defs>

  <!-- Window Container with Shadow -->
  <g filter="url(#shadow)">
    <rect x="20" y="15" width="840" height="390" rx="10" ry="10" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
    
    <!-- Window Titlebar -->
    <path d="M 20 25 C 20 19.5 24.5 15 30 15 L 850 15 C 855.5 15 860 19.5 860 25 L 860 52 L 20 52 Z" fill="url(#headerGrad)"/>
    <line x1="20" y1="52" x2="860" y2="52" stroke="#30363D" stroke-width="1"/>

    <!-- Window Controls (macOS style) -->
    <circle cx="42" cy="33.5" r="6" fill="#FF5F56" stroke="#E0443E" stroke-width="0.5"/>
    <circle cx="62" cy="33.5" r="6" fill="#FFBD2E" stroke="#DEA123" stroke-width="0.5"/>
    <circle cx="82" cy="33.5" r="6" fill="#27C93F" stroke="#1AAB29" stroke-width="0.5"/>

    <!-- Window Title Text -->
