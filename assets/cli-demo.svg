      <text x="64" y="352" font-size="11" fill="#8B949E">
        <tspan fill="#58A6FF">●</tspan> Prometheus Exporter streaming live on <tspan fill="#C9D1D9">http://0.0.0.0:9100/metrics</tspan> &bull; P90 ITL SLA Violation: <tspan fill="#3FB950">0.0%</tspan>
